name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm -v
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ballot_clarity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ballot_clarity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ballot_clarity_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Security audit policy
        run: npm run audit

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Production configuration policy
        run: npm run verify:production:fixture

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: End-to-end smoke test
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analytics bundle verification
        run: npm run verify:analytics
