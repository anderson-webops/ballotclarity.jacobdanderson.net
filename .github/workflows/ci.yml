name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm -v
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: ballot_clarity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ballot_clarity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ballot_clarity_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Unit tests
        run: npm run test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Verify standalone backend lockfile
        run: npm run verify:backend-lockfile

      - name: Security audit policy
        run: npm run audit

      - name: Production dependency audit
        run: npm run audit:production

      - name: Verify registry signatures
        run: npm run audit:signatures

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Production configuration policy
        run: npm run verify:production:fixture

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: End-to-end smoke test
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci --include=optional

      - name: Build
        run: npm run build

      - name: Analytics bundle verification
        run: npm run verify:analytics

  native-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install ARM64 dependencies
        run: npm ci --include=optional

      - name: Verify ARM64 native bindings
        run: npm run verify:native-bindings

      - name: Build on ARM64
        run: npm run build
