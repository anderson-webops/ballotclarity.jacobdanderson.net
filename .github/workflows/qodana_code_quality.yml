name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - name: Skip Qodana when QODANA_TOKEN is not configured
        if: env.QODANA_TOKEN == ''
        run: echo "QODANA_TOKEN is not configured; skipping Qodana."

      - uses: actions/checkout@v7
        if: env.QODANA_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Qodana Scan
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@v2026.1.3
        env:
          QODANA_TOKEN: ${{ env.QODANA_TOKEN }}
