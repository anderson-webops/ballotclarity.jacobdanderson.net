name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - name: Skip Qodana when QODANA_TOKEN is not configured
        if: env.QODANA_TOKEN == ''
        run: echo "QODANA_TOKEN is not configured; skipping Qodana."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.QODANA_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Qodana Scan
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          post-pr-comment: false
          use-annotations: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ env.QODANA_TOKEN }}
